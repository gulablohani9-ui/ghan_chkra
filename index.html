<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Ghan Chakra - Professional Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #e9ecef; }
        #app { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; text-align: center;}
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .input-group label { font-weight: bold; }
        input { width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;}
        .btn-group { text-align: center; margin-top: 20px; }
        button { background: #007bff; color: white; padding: 10px 25px; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; margin: 5px;}
        button.back { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: center; }
        th { background: #333; color: white; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ddd; margin-top: 20px; display: block; margin: 0 auto;}
        .report-section { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div id="input-screen">
            <h2>Planets Degree Entry (0-360°)</h2>
            <div class="grid" id="inputs"></div>
            <div class="btn-group">
                <button onclick="generateReport()">Generate Report</button>
            </div>
        </div>

        <div id="report-screen" class="report-section">
            <div class="btn-group">
                <button onclick="downloadPDF()">Download PDF</button>
                <button class="back" onclick="location.reload()">Back to Entry</button>
            </div>
            
            <div id="pdf-content" style="padding: 20px; background: white;">
                <h2>Nakshatra & Planet Placement</h2>
                <table id="result-table">
                    <thead>
                        <tr>
                            <th>Planet</th>
                            <th>Degree</th>
                            <th>Rashi</th>
                            <th>Nakshatra No.</th>
                            <th>Pada (1-4)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                
                <h2 style="margin-top:40px;">Ghan Chakra Overlay</h2>
                <canvas id="chakraCanvas" width="800" height="800"></canvas>
            </div>
        </div>
    </div>

    <script>
        const planets = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
        const rashiNames = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];
        
        const inputsDiv = document.getElementById('inputs');
        planets.forEach(p => {
            inputsDiv.innerHTML += `<div class="input-group"><label>${p}</label><br><input type="number" id="${p}" placeholder="Enter 0 to 360" max="360" min="0" required></div>`;
        });

        function generateReport() {
            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('report-screen').style.display = 'block';
            
            const tbody = document.querySelector('#result-table tbody');
            tbody.innerHTML = '';
            const degrees = [];
            
            planets.forEach(p => {
                let deg = parseFloat(document.getElementById(p).value) || 0;
                degrees.push(deg);
                
                let rashiIndex = Math.floor(deg / 30);
                let rashi = rashiNames[rashiIndex] || 'N/A';
                let nakshatra = Math.floor(deg / 13.3333) + 1;
                let pada = Math.floor((deg % 13.3333) / 3.3333) + 1;
                
                tbody.innerHTML += `<tr><td><b>${p}</b></td><td>${deg}°</td><td>${rashi}</td><td>${nakshatra}</td><td>${pada}</td></tr>`;
            });
            
            drawChakra(degrees);
        }

        function drawChakra(degrees) {
            const canvas = document.getElementById('chakraCanvas');
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const img = new Image();
            // YAHAN APNI IMAGE KA NAAM THEEK WAISA HI RAKHEIN JAISA GITHUB PAR UPLOAD KIYA HAI
            img.src = 'chakra1.png'; 
            
            img.onload = () => {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = canvas.width / 2.1; 
                
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#e74c3c'; // Red line color
                
                degrees.forEach(deg => {
                    let radians = (deg - 90) * (Math.PI / 180);
                    let destX = centerX + radius * Math.cos(radians);
                    let destY = centerY + radius * Math.sin(radians);
                    
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(destX, destY);
                    ctx.stroke();
                });
            };
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            html2pdf().from(element).set({
                margin: [10, 10, 10, 10],
                filename: 'Ghan-Chakra-Report.pdf',
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save();
        }
    </script>
</body>
</html>
