<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Ghan Chakra - Professional HD Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #e9ecef; }
        #app { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h2, h3 { border-bottom: 2px solid #333; padding-bottom: 5px; margin-top: 30px;}
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .input-group label { font-weight: bold; font-size: 14px;}
        input { width: 85%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;}
        button { background: #007bff; color: white; padding: 10px 25px; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; margin: 5px;}
        button.back { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;}
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #333; color: white; }
        .html2pdf__page-break { height: 0; page-break-before: always; margin: 0; padding: 0; }
        canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; border: 1px solid #ddd; }
        #report-screen { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div id="input-screen">
            <h2>1. Enter Houses (1-12) Degrees</h2>
            <div class="grid" id="inputs-houses"></div>
            
            <h2>2. Enter Planets Degrees</h2>
            <div class="grid" id="inputs-planets"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="generateReport()">Generate HD Report</button>
            </div>
        </div>

        <div id="report-screen">
            <div style="text-align: center; margin-bottom: 20px;">
                <button onclick="downloadPDF()">Download HD PDF</button>
                <button class="back" onclick="location.reload()">Back</button>
            </div>
            
            <div id="pdf-content" style="padding: 20px; background: white;">
                <div id="page1">
                    <h2>Planet & House Base Details</h2>
                    <table id="basic-table">
                        <thead>
                            <tr><th>Name</th><th>Type</th><th>Degree</th><th>Nakshatra No.</th><th>Pada</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>

                    <h2>Nakshatra Occupancy Report</h2>
                    <table id="nakshatra-table">
                        <thead>
                            <tr><th>Nakshatra No.</th><th>Occupied By (Planets & Houses)</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <!-- Force Page Break here so image never cuts -->
                <div class="html2pdf__page-break"></div>

                <div id="page2" style="padding-top: 20px;">
                    <h2 style="text-align:center;">Ghan Chakra Overlay</h2>
                    <!-- Canvas is large for HD rendering -->
                    <canvas id="chakraCanvas" width="1600" height="1600"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const planets = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
        const houses = ['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'H7', 'H8', 'H9', 'H10', 'H11', 'H12'];
        
        const hDiv = document.getElementById('inputs-houses');
        houses.forEach(h => {
            hDiv.innerHTML += `<div class="input-group"><label>${h}</label><br><input type="number" id="${h}" placeholder="0-360"></div>`;
        });

        const pDiv = document.getElementById('inputs-planets');
        planets.forEach(p => {
            pDiv.innerHTML += `<div class="input-group"><label>${p}</label><br><input type="number" id="${p}" placeholder="0-360"></div>`;
        });

        function generateReport() {
            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('report-screen').style.display = 'block';
            
            const basicTbody = document.querySelector('#basic-table tbody');
            const nakTbody = document.querySelector('#nakshatra-table tbody');
            basicTbody.innerHTML = '';
            nakTbody.innerHTML = '';
            
            const allData = [];
            const nakshatraGroups = {};

            // Collect Data
            [...houses, ...planets].forEach(name => {
                let val = document.getElementById(name).value;
                if (val !== "") {
                    let deg = parseFloat(val);
                    let type = houses.includes(name) ? 'House' : 'Planet';
                    let nakshatra = Math.floor(deg / 13.3333) + 1;
                    let pada = Math.floor((deg % 13.3333) / 3.3333) + 1;
                    
                    allData.push({ name, deg, type, nakshatra, pada });
                    
                    // Grouping for Nakshatra Report
                    if(!nakshatraGroups[nakshatra]) nakshatraGroups[nakshatra] = [];
                    nakshatraGroups[nakshatra].push(`${name} (Pada ${pada})`);
                    
                    basicTbody.innerHTML += `<tr><td><b>${name}</b></td><td>${type}</td><td>${deg}°</td><td>${nakshatra}</td><td>${pada}</td></tr>`;
                }
            });

            // Fill Nakshatra Group Table
            for(let i=1; i<=27; i++) {
                if(nakshatraGroups[i]) {
                    nakTbody.innerHTML += `<tr><td><b>Nakshatra ${i}</b></td><td>${nakshatraGroups[i].join(', ')}</td></tr>`;
                }
            }
            
            drawChakra(allData);
        }

        function drawChakra(data) {
            const canvas = document.getElementById('chakraCanvas');
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const img = new Image();
            img.src = 'chakra1.png'; // Ensure exact file name on GitHub
            
            img.onload = () => {
                // Image thodi choti draw hogi taaki text margins me aa sake
                ctx.drawImage(img, 150, 150, canvas.width - 300, canvas.height - 300);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const lineRadius = (canvas.width / 2) - 160; 
                
                data.forEach(item => {
                    let radians = (item.deg - 90) * (Math.PI / 180);
                    let destX = centerX + lineRadius * Math.cos(radians);
                    let destY = centerY + lineRadius * Math.sin(radians);
                    
                    // Draw Line
                    ctx.lineWidth = 4;
                    // Blue for Houses, Red for Planets
                    ctx.strokeStyle = item.type === 'House' ? '#0000FF' : '#FF0000'; 
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(destX, destY);
                    ctx.stroke();

                    // Draw Text
                    let textRadius = lineRadius + 30; // Push text outside the line
                    let textX = centerX + textRadius * Math.cos(radians);
                    let textY = centerY + textRadius * Math.sin(radians);
                    
                    ctx.fillStyle = item.type === 'House' ? '#0000FF' : '#FF0000';
                    ctx.font = 'bold 28px Arial'; // Large font for HD Canvas
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.name, textX, textY);
                });
            };
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            html2pdf().from(element).set({
                margin: [10, 10, 10, 10],
                filename: 'HD-Ghan-Chakra-Report.pdf',
                image: { type: 'jpeg', quality: 1.0 },
                // Scale 3 ensures HD quality output
                html2canvas: { scale: 3, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save();
        }
    </script>
</body>
</html>
